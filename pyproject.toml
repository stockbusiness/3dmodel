[project]
name = "art3d-validation"
version = "0.1.0"
description = "3Dアート品質検証システム（フェーズA）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.17,<0.1",
    "pillow>=11.0,<12",
    "argon2-cffi>=23.1,<24",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
# Tripo公式SDK。版を固定する（docs/provider-contracts.md）。
# A3.5 で実生成を行うときに入れる。入っていなくてもモック検証は動く
tripo = [
    # async extra を入れて aiohttp 実装を使う。
    # 入れないとSDKは自前のHTTP実装（legacy_client_impl）にフォールバックする
    "tripo3d[async]==0.4.2",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    # 画面の動作試験。ブラウザーが無い環境では該当の試験を自動で飛ばす
    "playwright>=1.49,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 は Depends() / Form() / File() を引数既定値に置く FastAPI の標準的な書き方に当たるため除外する
ignore = ["B008"]
