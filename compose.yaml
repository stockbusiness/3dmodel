# 仕様第3章：web と worker を別プロセスにし、共通の data ボリュームを使う。
# ローカル開発では 127.0.0.1 にのみ公開する（仕様第12章）。
# 限定公開（VPS＋Caddy）は deploy/ の上書きファイルを重ねて使う。

services:
  web:
    build: .
    image: art3d-validation:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY を .env に設定してください}
      APP_DATA_DIR: /srv/data
      APP_LIVE_API_ENABLED: ${APP_LIVE_API_ENABLED:-false}
      APP_GLOBAL_COST_CAP_USD: ${APP_GLOBAL_COST_CAP_USD:-}
      APP_CALIBRATION_TARGET_COUNT: ${APP_CALIBRATION_TARGET_COUNT:-0}
      APP_SESSION_TTL_HOURS: ${APP_SESSION_TTL_HOURS:-12}
      APP_TRIPO_DOWNLOAD_HOSTS: ${APP_TRIPO_DOWNLOAD_HOSTS:-}
      APP_MESHY_DOWNLOAD_HOSTS: ${APP_MESHY_DOWNLOAD_HOSTS:-}
      # 管理画面の接続テストと `python -m app.cli check-provider --connect` は
      # web で動くため、web にもキーが要る。どちらも認証を確かめるだけで
      # 生成は行わない（課金なし）。値は画面にもログにも出さない（仕様第12章）
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
    volumes:
      - data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: art3d-validation:local
    command: ["python", "-m", "app.worker"]
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY を .env に設定してください}
      APP_DATA_DIR: /srv/data
      APP_LIVE_API_ENABLED: ${APP_LIVE_API_ENABLED:-false}
      APP_TRIPO_DOWNLOAD_HOSTS: ${APP_TRIPO_DOWNLOAD_HOSTS:-}
      APP_MESHY_DOWNLOAD_HOSTS: ${APP_MESHY_DOWNLOAD_HOSTS:-}
      # 外部への送信・状態確認・成果物取得を行うのは worker
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
    volumes:
      - data:/srv/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:
